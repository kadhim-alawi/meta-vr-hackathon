# Builds Foldlings and publishes it to GitHub Pages, so judges can open a
# single HTTPS link in the Meta Quest Browser.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      after_deadline:
        description: 'Deploy after the entry deadline (only to restore the judged build)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      # The competition judges the entry as it was at the deadline
      # (Nov 18, 2026, 12:00 PM PT). Don't let a later push change it.
      - name: Respect the judging freeze
        if: ${{ !inputs.after_deadline }}
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d '2026-11-18T20:00:00Z' +%s)" ]; then
            echo "::error::The entry period has closed; the judged build must not change."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
